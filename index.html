        <h1>Ghulam Muhammad Khizar</h1>
        <p>
          Computer Science undergraduate at UET Lahore, moving into DevOps and cloud
          engineering. Linux, Docker, Kubernetes, CI/CD, infrastructure as code and AWS — with
          the operational habits that come from shipping a real data platform and having to
          keep it running.
        </p>

        <h2>About me</h2>
        <p>
          I spent a semester building a knowledge graph of Pakistan's computer-science
          research: 26,627 OpenAlex records cleaned into 26,188 papers, 42,774 authors and
          170,700 co-authorship edges, stored in a containerised Neo4j instance and analysed
          with graph data science. The engineering lesson was not the analysis — it was making
          the whole pipeline rerun identically on another machine.
        </p>

        <h2>Skills</h2>
        <p>
          <strong>Cloud &amp; delivery:</strong> AWS (Amplify, API Gateway, Lambda, DynamoDB),
          Docker, Kubernetes, CI/CD, infrastructure as code, Linux, Git.
        </p>
        <p>
          <strong>Automation:</strong> Python, Bash, PowerShell, TypeScript, SQL, pytest,
          Node.js.
        </p>
        <p>
          <strong>Data &amp; graph:</strong> Neo4j 5, Cypher, Graph Data Science, NetworkX,
          pandas, NumPy, SciPy.
        </p>
        <p>
          <strong>Services &amp; interfaces:</strong> FastAPI, React 19, Vite, Canvas 2D, REST,
          CORS.
        </p>
        <p>
          <strong>Security:</strong> Linux hardening, network security, threat modelling,
          detection and response.
        </p>

        <h2>Projects</h2>
        <p>
          <strong>Pakistan's Researchers Network</strong> — a co-authorship platform from
          OpenAlex to Neo4j, FastAPI and React, with a 2020/2021 time split for validation.
        </p>
        <p>
          <strong>KHAKI</strong> — a full-stack e-commerce storefront in Next.js 14: 20 routes,
          17 API endpoints, 16 Prisma models, Stripe checkout and an admin dashboard, running
          in production at
          <a href="https://khaki-amber.vercel.app" style="color: #d9ff66">khaki-amber.vercel.app</a>.
        </p>
        <p>
          <strong>This page</strong> — a static React build on AWS Amplify Hosting with an API
          Gateway + Lambda + DynamoDB leaderboard that degrades gracefully when offline.
        </p>
        <p>
          <strong>PageRank from scratch</strong> — a SQLite-backed crawler with iterated rank
          and a D3 view of the result.
        </p>
